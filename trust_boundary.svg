<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    Невидимый Щит — граница доверия (ADR-006)
  </text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#666">
    Офлайн-ядро отдельно от онлайн-слоя. Онлайн — только opt-in, только с явным согласием.
  </text>

  <!-- OFFLINE CORE -->
  <rect x="40" y="90" width="560" height="500" rx="10" fill="#f0f7f0" stroke="#2e7d32" stroke-width="3"/>
  <text x="320" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">
    ОФЛАЙН-ЯДРО — сеть не требуется никогда
  </text>

  <!-- capture layer -->
  <rect x="65" y="140" width="510" height="90" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">Захват (ADR-001/011/012)</text>
  <text x="80" y="180" font-size="11" fill="#333">NotificationListenerService · CallScreeningService</text>
  <text x="80" y="197" font-size="11" fill="#333">PACKAGE_ADDED · UsageStats (remote-access детект)</text>
  <text x="80" y="214" font-size="11" fill="#999">Ни один API не покидает устройство</text>

  <!-- ROMA pipeline -->
  <rect x="65" y="245" width="510" height="170" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="265" font-size="12" font-weight="bold" fill="#1a1a1a">ROMA-пайплайн (ADR-005)</text>

  <rect x="80" y="278" width="110" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="135" y="297" text-anchor="middle" font-size="10.5" font-weight="bold">Atomizer</text>
  <text x="135" y="312" text-anchor="middle" font-size="9" fill="#555">regex RU/KZ</text>

  <rect x="205" y="278" width="110" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="260" y="297" text-anchor="middle" font-size="10.5" font-weight="bold">Planner</text>
  <text x="260" y="312" text-anchor="middle" font-size="9" fill="#555">ShieldEngine</text>

  <rect x="330" y="278" width="110" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="385" y="293" text-anchor="middle" font-size="10.5" font-weight="bold">Executor</text>
  <text x="385" y="307" text-anchor="middle" font-size="9" fill="#555">llama.cpp+GBNF</text>
  <text x="385" y="319" text-anchor="middle" font-size="9" fill="#555">(ADR-002/004)</text>

  <rect x="455" y="278" width="110" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="510" y="297" text-anchor="middle" font-size="10.5" font-weight="bold">Aggregator</text>
  <text x="510" y="312" text-anchor="middle" font-size="9" fill="#555">Verdict</text>

  <path d="M190,301 L205,301" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M315,301 L330,301" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440,301 L455,301" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="80" y="352" font-size="11" fill="#333">Данные для детекта:</text>
  <text x="80" y="369" font-size="10.5" fill="#555">· Seed-лист доменов (Phishing.Database, MIT) — вшит в APK на этапе сборки, НЕ скачивается в рантайме</text>
  <text x="80" y="385" font-size="10.5" fill="#555">· Allowlist офиц. номеров банков — вшит в APK, обновляется только апдейтом приложения</text>
  <text x="80" y="401" font-size="10.5" fill="#555">· Regex-словарь легенд (ADR-015) — вшит в APK, ревьюженный человеком до релиза</text>

  <!-- output layer -->
  <rect x="65" y="425" width="510" height="60" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Доступный вывод (ADR-013)</text>
  <text x="80" y="464" font-size="10.5" fill="#333">TTS · вибро · полноэкранный алерт — локально, без сети</text>

  <rect x="65" y="500" width="510" height="70" rx="6" fill="#fff8f0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="80" y="520" font-size="12" font-weight="bold" fill="#e65100">Foreground service + автозапуск (ADR-008)</text>
  <text x="80" y="538" font-size="10.5" fill="#333">Держит ядро живым на MIUI/агрессивных OEM</text>
  <text x="80" y="554" font-size="10" fill="#999">Постоянная нотификация — UX-компромисс, не обход политики</text>

  <!-- BOUNDARY -->
  <line x1="620" y1="70" x2="620" y2="620" stroke="#c62828" stroke-width="3" stroke-dasharray="10,6"/>
  <rect x="590" y="330" width="60" height="26" fill="#ffffff"/>
  <text x="620" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">OPT-IN</text>

  <!-- gate -->
  <rect x="600" y="380" width="40" height="50" rx="20" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="620" y="410" text-anchor="middle" font-size="18">🔒</text>

  <!-- ONLINE LAYER -->
  <rect x="660" y="90" width="300" height="500" rx="10" fill="#fdf0f0" stroke="#c62828" stroke-width="3"/>
  <text x="810" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#c62828">
    ОНЛАЙН-СЛОЙ — opt-in
  </text>
  <text x="810" y="136" text-anchor="middle" font-size="10.5" fill="#999">требует сети + явного согласия</text>

  <rect x="680" y="155" width="260" height="100" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="695" y="175" font-size="12" font-weight="bold" fill="#1a1a1a">Пуш родственнику</text>
  <text x="695" y="193" font-size="10" fill="#333">Обычно через FCM → инфраструктура</text>
  <text x="695" y="207" font-size="10" fill="#333">вне РК = трансграничная передача</text>
  <text x="695" y="224" font-size="10" fill="#c62828" font-weight="bold">⚠ Нужно ОТДЕЛЬНОЕ согласие на</text>
  <text x="695" y="238" font-size="10" fill="#c62828" font-weight="bold">трансграничную передачу (ст.16 ЗРК №94-V)</text>

  <rect x="680" y="270" width="260" height="90" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="695" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">Апдейт базы доменов</text>
  <text x="695" y="308" font-size="10" fill="#333">Скачивание свежего фида поверх</text>
  <text x="695" y="322" font-size="10" fill="#333">вшитого seed-листа (ADR-009)</text>
  <text x="695" y="340" font-size="10" fill="#666">roadmap, не v1 (ADR-010)</text>

  <rect x="680" y="375" width="260" height="90" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="695" y="395" font-size="12" font-weight="bold" fill="#1a1a1a">Config-апдейт словаря</text>
  <text x="695" y="413" font-size="10" fill="#333">Подписанный JSON новых легенд</text>
  <text x="695" y="427" font-size="10" fill="#333">(EvoSkill-Lite, ADR-015)</text>
  <text x="695" y="445" font-size="10" fill="#666">roadmap, ревью человеком до публикации</text>

  <rect x="680" y="480" width="260" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="695" y="500" font-size="11" font-weight="bold" fill="#e65100">Требование локализации (18.01.2026)</text>
  <text x="695" y="517" font-size="10" fill="#333">Хранение ПДн граждан РК — только</text>
  <text x="695" y="531" font-size="10" fill="#333">на территории РК. «Облако где угодно»</text>
  <text x="695" y="545" font-size="10" fill="#333">не вариант, если фичи выше строим.</text>

  <path d="M645,405 L680,405" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend / open item -->
  <rect x="40" y="600" width="920" height="50" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="55" y="620" font-size="11" font-weight="bold" fill="#e65100">Непроверено (ADR-006, флажок):</text>
  <text x="55" y="637" font-size="10.5" fill="#333">Закон РК №256-VIII от 09.01.2026 (ИИ/информатизация, в силе с 11.07.2026) — детали не изучены, может влиять на онлайн-слой. Проверить до финализации ТЗ.</text>
</svg>
