# Android Gradle Plugin требует AndroidX (проект использует androidx.core/appcompat).
android.useAndroidX=true
android.nonTransitiveRClass=true

# JVM для Gradle-демона. ВАЖНО: собирать под JDK 17–21 (Gradle 8.9 не запускается
# на JDK 24). :core объявляет kotlin toolchain 21 — он резолвится в текущий JVM,
# если демон запущен на JDK 21, поэтому доп. скачивание тулчейна не требуется.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

kotlin.code.style=official
